<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AdCoin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0a0a0a; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { text-align: center; padding: 15px; background: #111; border-bottom: 1px solid #333; }
        .header h1 { color: #ffd700; font-size: 22px; font-weight: bold; }
        .header p { color: #888; font-size: 12px; margin-top: 5px; }
        .content { flex: 1; padding: 15px; overflow-y: auto; padding-bottom: 80px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 20px; margin-bottom: 15px; text-align: center; }
        .balance-card { border: 1px solid #ffd700; }
        .balance-title { color: #888; font-size: 14px; margin-bottom: 10px; }
        .balance-amount { color: #ffd700; font-size: 36px; font-weight: bold; }
        .btn { background: #ffd700; color: #000; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 15px; }
        .btn:active { opacity: 0.8; }
        .user-info { display: flex; align-items: center; gap: 15px; text-align: left; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #ffd700; border: 2px solid #ffd700; }
        .user-details h3 { font-size: 16px; color: #fff; margin-bottom: 4px; }
        .user-details p { font-size: 12px; color: #888; }
        
        /* History List Styles */
        .history-list { list-style: none; text-align: left; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .history-item:last-child { border-bottom: none; }
        .history-title { color: #ccc; }
        .history-date { color: #666; font-size: 11px; display: block; margin-top: 3px; }
        .history-amount { color: #4caf50; font-weight: bold; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #333; display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; font-size: 12px; cursor: pointer; padding: 5px 0; width: 25%; }
        .nav-item.active { color: #ffd700; }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; fill: currentColor; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AdCoin</h1>
        <p>Watch Ads. Earn Rewards.</p>
    </div>

    <div class="content">
        <div id="tab-home" class="tab-content active">
            <div class="card user-info">
                <div class="avatar" id="user-avatar">?</div>
                <div class="user-details">
                    <h3 id="user-name">Loading...</h3>
                    <p id="user-id">ID: ...</p>
                </div>
            </div>
            <div class="card balance-card">
                <div class="balance-title">Your Balance</div>
                <div class="balance-amount">🪙 <span id="user-balance">0</span></div>
            </div>
            
            <!-- Recent Activity Section -->
            <div class="card" style="text-align: left;">
                <h3 style="color: #ffd700; margin-bottom: 10px; font-size: 16px;">Recent Activity</h3>
                <ul id="history-list" class="history-list">
                    <li style="color: #666; font-size: 14px; text-align: center; padding: 10px;">No activity yet.</li>
                </ul>
            </div>
        </div>

        <div id="tab-ads" class="tab-content">
            <h2 style="color: #ffd700; text-align: center; margin-bottom: 15px;">Watch Ads</h2>
            <div class="card">
                <p style="margin-bottom: 10px;">Watch video and earn 10 Coins</p>
                <button class="btn" id="watchBtn">Watch Now</button>
            </div>
        </div>

        <div id="tab-friends" class="tab-content">
            <h2 style="color: #ffd700; text-align: center; margin-bottom: 15px;">Invite Friends</h2>
            <div class="card">
                <p style="margin-bottom: 15px; color: #888; font-size: 14px;">Invite friends and get 100 Coins!</p>
                <button class="btn" id="shareBtn">Copy Invite Link</button>
            </div>
        </div>

        <div id="tab-profile" class="tab-content">
            <h2 style="color: #ffd700; text-align: center; margin-bottom: 15px;">Profile</h2>
            <div class="card">
                <p style="color: #888; margin-bottom: 5px;">Username:</p>
                <p id="profile-username" style="margin-bottom: 15px;">@...</p>
                <p style="color: #888; margin-bottom: 5px;">User ID:</p>
                <p id="profile-id">...</p>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Home
        </div>
        <div class="nav-item" onclick="switchTab('ads', this)">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            Ads
        </div>
        <div class="nav-item" onclick="switchTab('friends', this)">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Friends
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            Profile
        </div>
    </div>

    <script>
        // 1. Initialize Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // 2. Get User Data
        let userData = { id: '123', name: 'User', username: 'No Username' };
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            userData.id = user.id;
            userData.name = user.first_name;
            userData.username = user.username ? '@' + user.username : 'No Username';
            
            document.getElementById('user-name').innerText = userData.name;
            document.getElementById('user-id').innerText = 'ID: ' + userData.id;
            document.getElementById('user-avatar').innerText = userData.name.charAt(0).toUpperCase();
            document.getElementById('profile-username').innerText = userData.username;
            document.getElementById('profile-id').innerText = userData.id;
        }

        // 3. Balance System
        let balance = parseInt(localStorage.getItem('adcoin_balance')) || 0;
        document.getElementById('user-balance').innerText = balance;

        // 4. History System
        let history = JSON.parse(localStorage.getItem('adcoin_history')) || [];
        
        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = '<li style="color: #666; font-size: 14px; text-align: center; padding: 10px;">No activity yet.</li>';
                return;
            }
            list.innerHTML = '';
            // Show latest 5 items
            history.slice(0, 5).forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div>
                        <div class="history-title">${item.title}</div>
                        <div class="history-date">${item.date}</div>
                    </div>
                    <div class="history-amount">+${item.amount} 🪙</div>
                `;
                list.appendChild(li);
            });
        }
        renderHistory(); // Render on load

        // 5. Watch Ad Button Event
        document.getElementById('watchBtn').addEventListener('click', function() {
            balance += 10;
            localStorage.setItem('adcoin_balance', balance);
            document.getElementById('user-balance').innerText = balance;
            
            // Add to history
            const now = new Date();
            const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            history.unshift({ title: 'Watched Ad', amount: 10, date: dateStr });
            localStorage.setItem('adcoin_history', JSON.stringify(history));
            renderHistory();

            tg.showAlert("You earned 10 Coins! 🪙");
        });

        // 6. Share Link Button Event
        document.getElementById('shareBtn').addEventListener('click', function() {
            const link = "https://t.me/AdCoin_Reward_Bot?start=" + userData.id;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => {
                    tg.showAlert("Link copied!");
                });
            } else {
                tg.showAlert("Link: " + link);
            }
        });

        // 7. Tab Switching Logic
        window.switchTab = function(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        };
    </script>
</body>
</html>
